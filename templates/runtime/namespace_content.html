<nav class="breadcrumb">
    <a href="/runtime" hx-get="/runtime" hx-target="#content" hx-push-url="true">Runtime</a>
    <span>›</span>
    <span>{{ namespace }}</span>
</nav>

<h1>{{ namespace }}</h1>

{% if workloads.is_empty() %}
<p>No application profiles in this namespace.</p>
{% else %}
<table>
    <thead>
        <tr>
            <th data-sort="text">Kind</th>
            <th data-sort="text">Workload</th>
            <th data-sort="text">Status</th>
        </tr>
    </thead>
    <tbody>
        {% for w in workloads %}
        <tr hx-get="/runtime/ns/{{ namespace }}/workload/{{ w.identity.name }}" hx-target="#content" hx-push-url="true" class="clickable">
            <td><code>{{ w.identity.kind }}</code></td>
            <td>{{ w.identity.workload_name }}</td>
            <td><span class="badge-status {{ w.completion }}">{{ w.completion }}</span></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endif %}
